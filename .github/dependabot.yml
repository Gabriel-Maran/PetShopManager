# Atualizações semanais das dependências e das actions do CI, sempre por pull request.
# A espera de 7 dias é a mesma do min-release-age do .npmrc: uma versão recém-publicada ainda
# pode ser retirada ou estar comprometida. Os alertas de segurança não esperam.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    # Mensagens no padrão do projeto: "chore(deps): ..." e "chore(deps-dev): ...".
    commit-message:
      prefix: chore
      include: scope
    # Cada SDK do Expo fixa a versão destes pacotes. Uma versão minor ou major fora da lista do SDK
    # quebra o app, então eles só recebem correções (patch). A troca de SDK é feita à mão, com
    # `npx expo install --fix`. Um pacote novo do SDK (como `expo-camera`) já entra pelo `expo-*`;
    # um `react-native-*` do SDK precisa ser incluído aqui e no grupo `expo-sdk`.
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      # As correções do SDK chegam juntas, porque os pacotes do Expo são testados em conjunto.
      expo-sdk:
        patterns: ['expo', 'expo-*', 'react', 'react-native', '@types/react', 'typescript']
      # O resto (como o react-native-calendars): versões menores e correções num PR só, e uma
      # versão major em PR próprio.
      minor-and-patch:
        update-types: [minor, patch]
      # As correções de segurança chegam num PR só, em vez de um PR por alerta.
      security:
        applies-to: security-updates
        patterns: ['*']

  # As actions estão fixadas por SHA no ci.yml; o Dependabot troca o SHA e o comentário da versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Todas as actions num PR só, para o CI ser atualizado de uma vez.
      actions:
        patterns: ['*']
