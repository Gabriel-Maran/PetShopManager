# Atualizações semanais das dependências e das actions do CI, sempre por pull request.
# A espera de 7 dias é a mesma do min-release-age do .npmrc: uma versão recém-publicada ainda
# pode ser retirada ou estar comprometida. Os alertas de segurança não esperam.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    # Mensagens no padrão do projeto: "chore(deps): ..." e "chore(deps-dev): ...".
    commit-message:
      prefix: chore
      include: scope
    # Cada SDK do Expo fixa a versão exata destes pacotes, e o Expo Go traz as mesmas versões nativas.
    # O `react` precisa ser idêntico ao renderer do `react-native`: até um patch (19.3.0 → 19.3.1)
    # quebra o app ao abrir, e o CI não percebe, porque não executa o app. Por isso o Dependabot não
    # mexe neles, e o SDK, inclusive de patch, é atualizado à mão com `npx expo install --fix`.
    # Um pacote novo do SDK (como `expo-camera`) já fica de fora pelo `expo-*`; um `react-native-*`
    # do SDK precisa entrar nesta lista.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
    groups:
      # O resto (como o react-native-calendars): versões menores e correções num PR só, e uma
      # versão major em PR próprio.
      minor-and-patch:
        update-types: [minor, patch]
      # As correções de segurança chegam num PR só, em vez de um PR por alerta.
      security:
        applies-to: security-updates
        patterns: ["*"]

  # As actions estão fixadas por SHA no ci.yml; o Dependabot troca o SHA e o comentário da versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Todas as actions num PR só, para o CI ser atualizado de uma vez.
      actions:
        patterns: ["*"]
