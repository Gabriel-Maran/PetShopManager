name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Só leitura: o job não publica nada nem escreve no repositório.
permissions:
  contents: read

# Um push novo cancela a verificação anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Este nome é o check exigido pelo ruleset do main. Se mudar, o ruleset precisa mudar junto.
    name: Typecheck e pacote Android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Sem telemetria do Expo no CI.
      EXPO_NO_TELEMETRY: 1
    steps:
      # Actions fixadas por SHA: uma tag pode ser movida para outro código, o SHA não.
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar as dependências do lock
        run: npm ci

      # O Linux diferencia maiúsculas de minúsculas nos nomes de arquivo, então um import com a
      # letra errada (como o do BUG-2) quebra aqui, mesmo funcionando no Windows.
      - name: Rodar as checagens
        run: npm run check
